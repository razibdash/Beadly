<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FBF0E4"/>
    </linearGradient>
    <linearGradient id="beadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B04B"/>
      <stop offset="100%" stop-color="#C97B63"/>
    </linearGradient>
    <radialGradient id="focalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="60%" stop-color="#F3B457"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8A4B2E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Bead loop: 12 beads arranged in a circle -->
  <g filter="url(#softShadow)">
    <!-- generate 12 beads around center 512,512 radius 260 -->
    <circle cx="512" cy="252" r="46" fill="url(#beadGrad)"/>
    <circle cx="642" cy="287" r="42" fill="url(#beadGrad)"/>
    <circle cx="732" cy="382" r="38" fill="url(#beadGrad)"/>
    <circle cx="767" cy="512" r="36" fill="url(#beadGrad)"/>
    <circle cx="732" cy="642" r="38" fill="url(#beadGrad)"/>
    <circle cx="642" cy="737" r="42" fill="url(#beadGrad)"/>
    <circle cx="512" cy="772" r="46" fill="url(#beadGrad)"/>
    <circle cx="382" cy="737" r="42" fill="url(#beadGrad)"/>
    <circle cx="292" cy="642" r="38" fill="url(#beadGrad)"/>
    <circle cx="257" cy="512" r="36" fill="url(#beadGrad)"/>
    <circle cx="292" cy="382" r="38" fill="url(#beadGrad)"/>
    <circle cx="382" cy="287" r="42" fill="url(#beadGrad)"/>
  </g>

  <!-- Focal / counting bead - larger, glowing, at top -->
  <circle cx="512" cy="252" r="60" fill="url(#focalGlow)" filter="url(#softShadow)"/>
  <circle cx="512" cy="252" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>

  <!-- subtle highlight dots on each bead for soft glossy feel -->
  <circle cx="500" cy="240" r="10" fill="#FFFFFF" opacity="0.35"/>
</svg>
